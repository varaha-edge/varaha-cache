[package]
name = "rv-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Edge agent for varaha-cache fleet management"

[[bin]]
name = "rv-agent"
path = "src/main.rs"

[dependencies]
# Workspace crates
rv-types = { workspace = true }
rv-vcl = { workspace = true }
rv-config = { workspace = true }
rv-admin = { workspace = true }

# Async
tokio = { workspace = true }
futures = "0.3"

# HTTP client
reqwest = { workspace = true }

# NATS
async-nats = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# UUID for node identity
uuid = { version = "1", features = ["v4", "serde"] }

# Hostname detection
hostname = "0.3"
