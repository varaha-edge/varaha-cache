version: "1"

# varaha-cache CI/CD pipeline

metadata:
  template: false

secrets:
  - name: kaniko_username
    key: prioarc-apps/varaha-cache/harbor_username
    engine: native
    type: repo

  - name: kaniko_password
    key: prioarc-apps/varaha-cache/harbor_password
    engine: native
    type: repo

steps:
  - name: fmt
    image: rust:1.88-slim
    pull: always
    commands:
      - apt-get update && apt-get install -y --no-install-recommends protobuf-compiler && rm -rf /var/lib/apt/lists/*
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: clippy
    image: rust:1.88-slim
    pull: always
    commands:
      - apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler && rm -rf /var/lib/apt/lists/*
      - rustup component add clippy
      - cargo clippy --workspace --all-targets -- -D warnings

  - name: test
    image: rust:1.88-slim
    pull: always
    commands:
      - apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler && rm -rf /var/lib/apt/lists/*
      - cargo test --workspace

  - name: build
    image: rust:1.88-slim
    pull: always
    commands:
      - apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler && rm -rf /var/lib/apt/lists/*
      - cargo build --workspace --release

