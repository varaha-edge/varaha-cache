version: "1"

# varaha-cache CI/CD pipeline

metadata:
  template: false

steps:
  - name: fmt
    image: rust:1.87-slim
    pull: always
    commands:
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: clippy
    image: rust:1.87-slim
    pull: always
    commands:
      - rustup component add clippy
      - cargo clippy --workspace --all-targets -- -D warnings

  - name: test
    image: rust:1.87-slim
    pull: always
    commands:
      - cargo test --workspace

  - name: build
    image: rust:1.87-slim
    pull: always
    commands:
      - cargo build --workspace --release

  - name: docker-build-push
    image: target/vela-kaniko:latest
    pull: always
    ruleset:
      branch: [main]
      event: [push]
    secrets: [harbor_username, harbor_password]
    parameters:
      registry: registry.intra.varaha.io
      repo: registry.intra.varaha.io/varaha/varaha-cache
      username: ${HARBOR_USERNAME}
      password: ${HARBOR_PASSWORD}
      tags:
        - latest
        - "build-${VELA_BUILD_NUMBER}"
      build_args:
        - "RUST_VERSION=1.87"
