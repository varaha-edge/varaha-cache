services:
  varaha-cache:
    image: registry.intra.varaha.io/prioarc-apps/varaha-cache:latest
    platform: linux/amd64
    ports:
      - "6081:6081"   # HTTP client-facing
      - "6082:6082"   # Admin CLI
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel.intra.varaha.io:4317
      - OTEL_SERVICE_NAME=varaha-cache
      - RUST_LOG=info
    volumes:
      - ./examples/docker.vcl:/etc/varaha-cache/docker.vcl:ro
    command:
      - "-a"
      - "0.0.0.0:6081"
      - "-T"
      - "0.0.0.0:6082"
      - "-b"
      - "172.28.0.10:8132"
      - "-f"
      - "/etc/varaha-cache/docker.vcl"
      - "-s"
      - "malloc,256m"
    networks:
      cache-net:
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: nginx:alpine
    volumes:
      - ./examples/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8132"
    networks:
      cache-net:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

networks:
  cache-net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
